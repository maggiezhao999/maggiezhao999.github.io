<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maggie Zhao – Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
</head>

<body>
  <div id="bg"></div>

  <div class="content">
    <section class="hero">
      <h1 class="hero-name">Maggie Zhao</h1>
    </section>

    <section class="about">
      <div class="about-inner">
        <h2 class="about-title">About</h2>
        <p class="about-text">
          Maggie Zhao is a student majoring in Design and Technology and was majored in Photography at Parsons School of Design.
          She is based in New York and Beijing.
        </p>
        <p class="about-text">
          Contact:<br>
          <a class="about-link" href="mailto:maggiejasmer@gmail.com">maggiejasmer@gmail.com</a>
        </p>
      </div>
    </section>

    <section class="works">
      <div class="categorybar">
        <div class="categorybar-inner">
          <button class="category-tab is-active" data-category="interactive">Interactive</button>
          <button class="category-tab" data-category="collage">Collage and images</button>
          <button class="category-tab" data-category="photography">Photography</button>
          <button class="category-tab" data-category="videos">Videos</button>
          <button class="category-tab" data-category="p5js">p5.js</button>
        </div>
      </div>

      <div id="preview" class="preview-row"></div>
    </section>
  </div>

  <div id="viewer" aria-hidden="true">
    <div id="viewer-backdrop"></div>
    <div id="viewer-stage">
      <iframe id="viewer-frame" title="Viewer content"></iframe>
    </div>
  </div>

  <script src="categories.js"></script>
  <script src="bg.js"></script>
</body>
</html>
